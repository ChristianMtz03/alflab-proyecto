name: AlfLab CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  App_name: AlfLab Proyecto
  Dotnet_Version: "8.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Llamada al workflow de variables ─────────────────────────────────────
  call_env:
    uses: ./.github/workflows/env-variables.yml

  build:
    runs-on: ubuntu-latest
    needs: call_env

    steps:
      # ─── Información del proyecto ──────────────────────────────────────────
      - name: Mostrar Variables del Proyecto
        env:
          TipoEjecucion: CI Build
        run: |
          echo "Aplicacion: $App_name"
          echo "Version de framework: $Dotnet_Version"
          echo "Tipo de ejecucion: $TipoEjecucion"
          echo "Mostrar rama de liberacion: ${{ github.ref }}"

      # ─── Checkout del código ───────────────────────────────────────────────
      - name: Revision de codigo
        uses: actions/checkout@v4

      # ─── Reemplazar cadena de conexión en appsettings.json ─────────────────
      - name: Reemplazar appsettings
        shell: pwsh
        run: |
          $json = Get-Content "alflab.catalogos.api/AlfLab.Catalogos.Api/appsettings.json" | ConvertFrom-Json
          $json.ConnectionStrings.MySqlConnection = "${{ secrets.DB_CONNECTION }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content "alflab.catalogos.api/AlfLab.Catalogos.Api/appsettings.json"
          echo $json

      # ─── Build API .NET 8 ──────────────────────────────────────────────────
      - name: Configurar .NET ${{ env.Dotnet_Version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.Dotnet_Version }}

      - name: Restaurar dependencias API Catalogos
        working-directory: alflab.catalogos.api
        run: dotnet restore AlfLab.Catalogos.Api.sln

      - name: Build API Catalogos (.NET)
        working-directory: alflab.catalogos.api
        run: dotnet build AlfLab.Catalogos.Api.sln --no-restore --configuration Release

      # ─── Build API NestJS ──────────────────────────────────────────────────
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias API Operaciones
        working-directory: alflab.operaciones.api/alflab-operaciones-api
        run: npm install

      - name: Build API Operaciones (NestJS)
        working-directory: alflab.operaciones.api/alflab-operaciones-api
        run: npm run build

  # ─── Docker: construir y publicar imágenes en GHCR ────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Revision de codigo
        uses: actions/checkout@v4

      # ─── Convertir owner a minúsculas (requerido por GHCR) ────────────────
      - name: Preparar nombre de imagen en minusculas
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # ─── Login a GitHub Container Registry ────────────────────────────────
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Imagen API Catalogos (.NET) ───────────────────────────────────────
      - name: Build y Push imagen API Catalogos
        uses: docker/build-push-action@v5
        with:
          context: ./alflab.catalogos.api
          file: ./alflab.catalogos.api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/alflab-catalogos-api:latest

      # ─── Imagen API Operaciones (NestJS) ───────────────────────────────────
      - name: Build y Push imagen API Operaciones
        uses: docker/build-push-action@v5
        with:
          context: ./alflab.operaciones.api/alflab-operaciones-api
          file: ./alflab.operaciones.api/alflab-operaciones-api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/alflab-operaciones-api:latest